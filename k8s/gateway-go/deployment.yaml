apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-go
  labels: { app: gateway-go }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway-go } }
  template:
    metadata: { labels: { app: gateway-go } }
    spec:
      containers:
        - name: gateway-go
          image: gateway-go:spike
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - {
                name: DATABASE_URL,
                value: "postgres://microservices:password@postgres:5432/gateway?sslmode=disable",
              }
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits: { memory: "64Mi", cpu: "200m" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
